# main 에 올릴 때: 계산 대조·화면 테스트만 (프로그램은 만들지 않음)
# Actions 에서 직접 실행(workflow_dispatch)할 때만: 테스트 → 윈도우 .exe · 맥 .dmg 빌드 → Releases 에 "v버전" 으로 올림
# (같은 버전이면 파일만 새로 바꿔 끼움. 버전은 jinju_cal/__init__.py 의 __version__)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14   # 애플 실리콘(M1 이후)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller==6.16.0
      - run: pyinstaller --noconfirm jinju-cal.spec
      - name: 진단
        continue-on-error: true
        run: |
          set +e
          APP="dist/상품가격계산기.app"
          sw_vers; codesign --version 2>&1 || true
          echo "== 실행 파일"; ls -la "$APP/Contents/MacOS" | head; plutil -p "$APP/Contents/Info.plist" | head -30
          echo "== 이름에 한글/공백 있는 파일"; find "$APP" | LC_ALL=C grep -n '[^ -~]' | head -20
          echo "== Mach-O 개수"; find "$APP" -type f -exec file {} + | grep -c Mach-O
          echo "== 9) scripts/mac_sign.sh"
          cp -R "$APP" /tmp/A9.app; bash scripts/mac_sign.sh /tmp/A9.app; echo "sign rc=$?"
          codesign -dv /tmp/A9.app 2>&1 | grep -E 'Sealed|Info.plist|Signature'
          mkdir -p /tmp/d9 && cp -R /tmp/A9.app "/tmp/d9/상품가격계산기.app" && hdiutil create -volname t -srcfolder /tmp/d9 -ov -format UDZO /tmp/t9.dmg -quiet
          m=$(mktemp -d); hdiutil attach /tmp/t9.dmg -mountpoint "$m" -nobrowse -quiet; codesign --verify --deep --strict "$m/상품가격계산기.app"; echo "dmg verify rc=$?"
          # 인터넷에서 받은 것처럼 표시해 Gatekeeper 판정 보기
          cp -R "$m/상품가격계산기.app" /tmp/Q.app; hdiutil detach "$m" -quiet
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" /tmp/Q.app
          spctl -a -vv -t exec /tmp/Q.app 2>&1 | head -3; syspolicy_check distribution /tmp/Q.app 2>&1 | head -8
          QT_QPA_PLATFORM=offscreen /tmp/A9.app/Contents/MacOS/상품가격계산기 & p=$!; sleep 8; kill -0 $p && echo "running OK" || echo "exited"; kill $p 2>/dev/null
          echo "== 끝"
