# main 에 올릴 때: 계산 대조·화면 테스트만 (프로그램은 만들지 않음)
# Actions 에서 직접 실행(workflow_dispatch)할 때만: 테스트 → 윈도우 .exe · 맥 .dmg 빌드 → Releases 에 "v버전" 으로 올림
# (같은 버전이면 파일만 새로 바꿔 끼움. 버전은 jinju_cal/__init__.py 의 __version__)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Qt 화면 없이 실행에 필요한 것
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: 웹판 계산과 대조
        run: python tests/test_core.py
      - name: 화면 동작
        env: { QT_QPA_PLATFORM: offscreen }
        run: python tests/test_ui.py
      - name: 업데이트 동작
        run: python tests/test_update.py
      - name: 고금 매입 (고금시세계산 원본 검사)
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -X faulthandler tests/test_goldmetal.py

  windows:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller==6.16.0
      - name: 고금 매입 원본 검사 (실제 윈도우·맑은 고딕)
        run: python -X faulthandler tests/test_goldmetal.py
      - run: pyinstaller --noconfirm jinju-cal.spec
      - name: 만든 exe 실행 확인 (두 탭)
        shell: pwsh
        run: |
          $env:JINJU_CAL_DATA = Join-Path $env:RUNNER_TEMP "smoke"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "smoke-appdata"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process -FilePath "dist/상품가격계산기.exe" -ArgumentList "--smoke" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: 업데이트 바꿔치기 확인 (실행 중인 exe)
        run: python tests/test_update_ci.py windows "dist/상품가격계산기.exe"
      - name: 이름 정리
        shell: pwsh
        run: |
          $v = (Select-String -Path jinju_cal/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist/상품가격계산기.exe" "out/jinju-cal-$v-windows.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  mac:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14   # 애플 실리콘(M1 이후)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller==6.16.0
      - name: 고금 매입 원본 검사 (실제 맥·글자 크기 보정)
        run: python -X faulthandler tests/test_goldmetal.py
      - run: pyinstaller --noconfirm jinju-cal.spec
      # 앱 서명(임시 서명)을 안쪽부터 다시 하고 확인 — 깨졌으면 여기서 멈춤 (맥 "손상된 파일" 방지)
      - name: 앱 서명 (임시 서명) 및 확인
        run: bash scripts/mac_sign.sh "dist/상품가격계산기.app"
      - name: 만든 앱 실행 확인 (두 탭)
        run: |
          export JINJU_CAL_DATA="$RUNNER_TEMP/smoke" APPDATA="$RUNNER_TEMP/smoke-appdata"
          mkdir -p "$APPDATA"
          "dist/상품가격계산기.app/Contents/MacOS/JinjuCal" --smoke; echo "exit code: $?"
      - name: dmg 만들기
        run: |
          v=$(sed -n 's/__version__ = "\(.*\)"/\1/p' jinju_cal/__init__.py)
          mkdir -p out dmg
          cp -R "dist/상품가격계산기.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "상품가격계산기" -srcfolder dmg -ov -format UDZO "out/jinju-cal-$v-mac.dmg"
          # dmg 안의 앱도 서명이 그대로인지 확인 (깨졌으면 여기서 멈춰 올리지 않음)
          mnt=$(mktemp -d)
          hdiutil attach "out/jinju-cal-$v-mac.dmg" -mountpoint "$mnt" -nobrowse -quiet
          codesign --verify --deep --strict --verbose=2 "$mnt/상품가격계산기.app"
          hdiutil detach "$mnt" -quiet
      - name: 업데이트 바꿔치기 확인 (dmg → 실행 중인 앱)
        run: |
          v=$(sed -n 's/__version__ = "\(.*\)"/\1/p' jinju_cal/__init__.py)
          python tests/test_update_ci.py mac "out/jinju-cal-$v-mac.dmg" "dist/상품가격계산기.app"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: out/* }

  release:
    needs: [windows, mac]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Releases 에 올리기
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(sed -n 's/__version__ = "\(.*\)"/\1/p' jinju_cal/__init__.py)
          ls -la files
          if gh release view "v$v" >/dev/null 2>&1; then
            # 이번에 만든 것과 이름이 다른 예전 파일은 지움
            for a in $(gh api "repos/${{ github.repository }}/releases/tags/v$v" -q '.assets[] | "\(.id)=\(.name)"'); do
              [ -e "files/${a#*=}" ] || gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${a%%=*}"
            done
            gh release upload "v$v" files/* --clobber
          else
            gh release create "v$v" files/* --title "상품가격계산기 $v" --notes "윈도우: .exe 를 내려받아 실행 · 맥: .dmg 를 열고 앱을 응용 프로그램 폴더로 끌어 넣기 (처음 한 번은 앱을 오른쪽 클릭 → 열기)"
          fi
