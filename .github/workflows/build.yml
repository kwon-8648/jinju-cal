# main 에 올릴 때: 계산 대조·화면 테스트만 (프로그램은 만들지 않음)
# Actions 에서 직접 실행(workflow_dispatch)할 때만: 테스트 → 윈도우 .exe · 맥 .dmg 빌드 → Releases 에 "v버전" 으로 올림
# (같은 버전이면 파일만 새로 바꿔 끼움. 버전은 jinju_cal/__init__.py 의 __version__)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14   # 애플 실리콘(M1 이후)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller==6.16.0
      - run: pyinstaller --noconfirm jinju-cal.spec
      - name: 진단
        continue-on-error: true
        run: |
          set +e
          APP="dist/상품가격계산기.app"
          sw_vers; codesign --version 2>&1 || true
          echo "== 실행 파일"; ls -la "$APP/Contents/MacOS" | head; plutil -p "$APP/Contents/Info.plist" | head -30
          echo "== 이름에 한글/공백 있는 파일"; find "$APP" | LC_ALL=C grep -n '[^ -~]' | head -20
          echo "== Mach-O 개수"; find "$APP" -type f -exec file {} + | grep -c Mach-O
          echo "== 안쪽 번들"; find "$APP/Contents" \( -name "*.framework" -o -name "*.app" -o -name "*.bundle" -o -name "*.appex" \) -prune | sed "s|$APP/||" | head -40
          echo "== 서명 기존 상태"; codesign -dv "$APP" 2>&1 | head -8
          echo "== 5) 파일 → 안쪽 번들(깊은 것부터) → 앱"
          cp -R "$APP" /tmp/A5.app
          T=/tmp/A5.app
          find "$T/Contents" -type f -exec file {} + | grep Mach-O | cut -d: -f1 | while IFS= read -r f; do codesign --force --sign - "$f" >/dev/null 2>&1 || echo "file fail $f"; done
          find "$T/Contents" -type d \( -name "*.framework" -o -name "*.app" -o -name "*.bundle" \) | awk '{print length, $0}' | sort -rn | cut -d' ' -f2- | while IFS= read -r b; do codesign --force --sign - "$b" >/tmp/b.log 2>&1 || { echo "bundle fail $b"; cat /tmp/b.log; }; done
          codesign --force --sign - "$T"; echo "app rc=$?"
          codesign --verify --deep --strict --verbose=4 "$T" 2>&1 | grep -v -- '--prepared\|--validated' | tail -15; echo "verify rc=${PIPESTATUS[0]}"
          spctl -a -vv -t exec "$T" 2>&1 | tail -3
          echo "== 6) 같은 앱을 dmg 로 묶었다 꺼내도 그대로인지"
          mkdir -p /tmp/dd && cp -R "$T" "/tmp/dd/상품가격계산기.app" && hdiutil create -volname t -srcfolder /tmp/dd -ov -format UDZO /tmp/t.dmg -quiet
          m=$(mktemp -d); hdiutil attach /tmp/t.dmg -mountpoint "$m" -nobrowse -quiet; codesign --verify --deep --strict "$m/상품가격계산기.app"; echo "dmg verify rc=$?"; hdiutil detach "$m" -quiet
          echo "== 7) 실행"
          QT_QPA_PLATFORM=offscreen "$T/Contents/MacOS/상품가격계산기" & p=$!; sleep 8; kill -0 $p && echo "running OK" || echo "exited"; kill $p 2>/dev/null
