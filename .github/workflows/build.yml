# main 에 올릴 때: 계산 대조·화면 테스트만 (프로그램은 만들지 않음)
# Actions 에서 직접 실행(workflow_dispatch)할 때만: 테스트 → 윈도우 .exe · 맥 .dmg 빌드 → Releases 에 "v버전" 으로 올림
# (같은 버전이면 파일만 새로 바꿔 끼움. 버전은 jinju_cal/__init__.py 의 __version__)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14   # 애플 실리콘(M1 이후)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller==6.16.0
      - run: pyinstaller --noconfirm jinju-cal.spec
      - name: 진단
        continue-on-error: true
        run: |
          set +e
          APP="dist/상품가격계산기.app"
          sw_vers; codesign --version 2>&1 || true
          echo "== 실행 파일"; ls -la "$APP/Contents/MacOS" | head; plutil -p "$APP/Contents/Info.plist" | head -30
          echo "== 이름에 한글/공백 있는 파일"; find "$APP" | LC_ALL=C grep -n '[^ -~]' | head -20
          echo "== Mach-O 개수"; find "$APP" -type f -exec file {} + | grep -c Mach-O
          echo "== 1) 한 파일씩 서명 (안쪽부터)"
          cp -R "$APP" /tmp/A1.app
          find /tmp/A1.app/Contents -type f -exec file {} + | grep Mach-O | cut -d: -f1 | awk '{print length, $0}' | sort -rn | cut -d' ' -f2- | while IFS= read -r f; do
            codesign --force --sign - "$f" >/tmp/cs.log 2>&1; rc=$?; [ $rc -ne 0 ] && { echo "rc=$rc $f"; cat /tmp/cs.log; }
          done
          codesign --force --sign - /tmp/A1.app; echo "bundle rc=$?"
          codesign --verify --deep --strict --verbose=2 /tmp/A1.app; echo "verify rc=$?"
          echo "== 2) 영문 이름 앱으로 --deep"
          cp -R "$APP" /tmp/JinjuCal.app
          codesign --force --deep --sign - /tmp/JinjuCal.app; echo "deep ascii rc=$?"
          echo "== 3) 원래 이름 --deep (xattr 지운 뒤)"
          cp -R "$APP" "/tmp/상품가격계산기.app"; xattr -cr "/tmp/상품가격계산기.app"
          codesign --force --deep --sign - "/tmp/상품가격계산기.app"; echo "deep korean rc=$?"
          echo "== 4) --deep 없이 번들만"
          cp -R "$APP" /tmp/A4.app; codesign --force --sign - /tmp/A4.app; echo "nodeep rc=$?"; codesign --verify --deep --strict --verbose=2 /tmp/A4.app; echo "verify rc=$?"
